tags:
  - Shop
summary: Get Shop by id
operationId: getShopById
description: Get Shop by id
parameters:
  - in: path
    name: shopId
    required: true
    schema:
      type: string
      example: 68498236a100312bea079030

security:
  - bearerAuth: []

responses:
  '200':
    description: Successfully found shop with id
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found shop with id!
            data:
              type: object
              required:
                - shop
              properties:
                shop:
                  $ref: '../../../components/schemas/GetShopIdResponse.yaml'

  '400':
    $ref: ../../../components/responses/400.yaml

  '404':
    $ref: ../../../components/responses/404.yaml

  '500':
    $ref: '../../../components/responses/500.yaml'
