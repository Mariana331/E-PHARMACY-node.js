tags:
  - User
summary: Login User
operationId: loginUser
description: Authenticate User and create session
security: []

requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '../../components/schemas/SignInRequest.yaml'

responses:
  '200':
    description: 'Successfully logged in a user!'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Successfully logged in a user!'
            data:
              type: object
              required:
                - user
                - accessToken
              properties:
                user:
                  type: object
                  required:
                    - _id
                    - email
                  properties:
                    _id:
                      type: string
                      description: User id
                      example: 68efd834f1781f960b1e7a6c
                    email:
                      type: string
                      description: User email
                      example: john@gmail.com
                accessToken:
                  type: string
                  description: User accessToken
                  example: TYEJ0iVVw81X8Bn0hX/nykwWhcYQ1EsjAHR

  '401':
    $ref: '../../components/responses/401.yaml'
