tags:
  - Product
summary: Delete Product
operationId: deleteProduct
description: Product Delete
parameters:
  - in: path
    name: shopId
    required: true
    schema:
      type: string
      example: 68498236a100312bea079030

  - in: path
    name: productId
    required: true
    schema:
      type: string
      example: 69a5716761228a7ed65a3ae9

security:
  - bearerAuth: []

responses:
  '200':
    description: Product deleted successfully!
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Product deleted successfully!

  '404':
    $ref: '../../../components/responses/404.yaml'
  '500':
    $ref: '../../../components/responses/500.yaml'
