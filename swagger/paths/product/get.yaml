tags:
  - Product
summary: Get Products
operationId: getProducts
description: Get Products list and their categories
parameters:
  - in: path
    name: shopId
    required: true
    description: Shop id
    schema:
      type: string
      example: 68498236a100312bea079030

  - in: query
    name: page
    required: false
    description: Page number
    schema:
      type: integer
      example: 1

  - in: query
    name: perPage
    required: false
    description: Items per page
    schema:
      type: integer
      example: 10

  - in: query
    name: sortBy
    required: false
    description: Field to sort by
    schema:
      type: string
      example: '_id'

  - in: query
    name: sortOrder
    required: false
    description: Sort direction
    schema:
      type: string
      enum: [asc, desc]
      example: 'asc'

  - in: query
    name: category
    required: false
    description: Filter by category
    schema:
      type: string
      enum: ['Hand', 'Head', 'Medicine', 'Leg', 'Dental Care', 'Heart']
      example: 'Hand'
security:
  - bearerAuth: []

responses:
  '200':
    description: 'Successfully found products!'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Successfully found products!'
            data:
              type: object
              required:
                - data
                - page
                - perPage
                - totalItems
                - totalPages
                - hasNextPage
                - hasPreviousPage
              properties:
                data:
                  type: array
                  items:
                    $ref: '../../components/schemas/GetProductsResponse.yaml'

                page:
                  type: number
                  example: 2
                perPage:
                  type: number
                  example: 4
                totalItems:
                  type: number
                  example: 4
                totalPages:
                  type: number
                  example: 4
                hasNextPage:
                  type: boolean
                  example: false
                hasPreviousPage:
                  type: boolean
                  example: true

  '404':
    $ref: '../../components/responses/404.yaml'
  '500':
    $ref: '../../components/responses/500.yaml'
