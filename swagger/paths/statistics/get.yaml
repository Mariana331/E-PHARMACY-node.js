tags:
  - Statistics
summary: Get Statistics
operationId: getStatistics
description: Statistics about products, suppliers and customers

security:
  - bearerAuth: []

responses:
  '200':
    description: Successfully get statistics!
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully get statistics!
            data:
              type: object
              required:
                - products
                - suppliers
                - customers
                - recentlyCustomers
                - incomeExpense
              properties:
                products:
                  type: integer
                  description: Statistics products
                  example: 63
                suppliers:
                  type: integer
                  description: Statistics suppliers
                  example: 5
                customers:
                  type: integer
                  description: Statistics customers
                  example: 88
                recentlyCustomers:
                  type: array
                  items:
                    $ref: '../../components/schemas/GetStatisticsResponse.yaml'
                incomeExpense:
                  type: array
                  items:
                    $ref: '../../components/schemas/incomeExpense.yaml'

  '404':
    $ref: '../../components/responses/404.yaml'
  '500':
    $ref: '../../components/responses/500.yaml'
