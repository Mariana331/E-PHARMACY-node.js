type: object
required:
  - _id
  - photo
  - name
  - address
  - products
  - totalPrice
  - status
  - order_date
properties:
  _id:
    type: string
    description: Order id
    example: 68efd834f1781f960b1e7a6c
  photo:
    type: string
    description: Order photo
    example: https://i.imgur.com/hz6bZkb.png
  name:
    type: string
    description: Order name
    example: Noah Davis
  address:
    type: string
    description: Order address
    example: Banani-11, Bldg. 91, Apt. 181
  products:
    type: number
    description: total products
    example: 67
  totalPrice:
    type: number
    description: totalPrice
    example: 420.50
  status:
    type: string
    description: Order status
    enum:
      [
        'Delivered',
        'Processing',
        'Completed',
        'Shipped',
        'Cancelled',
        'Confirmed',
      ]
    example: Delivered
  order_date:
    type: string
    format: date-time
    example: 2025-10-08T18:21:10.157+00:00
