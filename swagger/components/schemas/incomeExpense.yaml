type: object
required:
  - _id
  - name
  - amount
  - type
properties:
  _id:
    type: string
    description: incomeExpense id
    example: 68efd834f1781f960b1e7a6c
  name:
    type: string
    description: Review name
    example: Maria Tkachyk
  amount:
    type: string
    description: Amount
    example: '200.00'
  type:
    type: string
    enum: ['Income', 'Expense', 'Error']
    example: Income
