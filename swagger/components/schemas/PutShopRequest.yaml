type: object
required:
  - name
  - owner
  - email
  - phone
  - street
  - city
  - zip
  - delivery
properties:
  name:
    type: string
    description: Shop name
    example: Goods
  owner:
    type: string
    description: Owner name
    example: John
  email:
    type: string
    description: Shop email
    example: goods@gmail.com
  phone:
    type: string
    description: Mobile number
    example: '+380976655445'
  street:
    type: string
    description: Street address
    example: Kretoria F45
  city:
    type: string
    description: City address
    example: Castlerea
  zip:
    type: number
    description: Zip / Postal address
    example: 10010
  delivery:
    type: boolean
    description: Has own delivery system
    example: true
