type: object
required:
  - photo
  - name
  - price
  - category
properties:
  photo:
    type: string
    description: Product photo
    example: https://i.ibb.co/X330FTj/shop-4-10-1000x1000-min.jpg
  name:
    type: string
    description: Product name
    example: Shampoo
  price:
    type: number
    description: Product price
    example: 45.66
  category:
    type: string
    description: Product category
    enum: ['Hand', 'Head', 'Medicine', 'Leg', 'Dental Care', 'Heart']
    example: Hand
