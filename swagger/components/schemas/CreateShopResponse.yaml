type: object
required:
  - _id
  - name
  - owner
  - email
  - phone
  - street
  - city
  - zip
  - delivery
  - createdAt
  - updatedAt
properties:
  _id:
    type: string
    description: User id
    example: 68efd834f1781f960b1e7a6c
  name:
    type: string
    description: Shop name
    example: Goods
  owner:
    type: string
    description: Owner name
    example: John
  email:
    type: string
    description: Shop email
    example: goods@gmail.com
  phone:
    type: string
    description: Mobile number
    example: '+380976655445'
  street:
    type: string
    description: Street address
    example: Kretoria F45
  city:
    type: string
    description: City address
    example: Castlerea
  zip:
    type: number
    description: Zip / Postal address
    example: 10010
  delivery:
    type: boolean
    description: Has own delivery system
    example: true
  createdAt:
    type: string
    format: date-time
    example: 2025-10-08T18:21:10.157+00:00
  updatedAt:
    type: string
    format: date-time
    example: 2025-10-08T18:21:10.157+00:00
