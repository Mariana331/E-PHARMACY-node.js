type: object
required:
  - name
  - owner
  - email
  - logo
  - _id
  - createdAt
  - updatedAt
properties:
  name:
    type: string
    description: Shop name
    example: Goods
  owner:
    type: string
    description: Owner name
    example: John
  email:
    type: string
    description: Shop email
    example: goods@gmail.com
  logo:
    type: string
    description: Shop logo
    example: logo
  _id:
    type: string
    description: User id
    example: 68efd834f1781f960b1e7a6c
  createdAt:
    type: string
    format: date-time
    example: 2025-10-08T18:21:10.157+00:00
  updatedAt:
    type: string
    format: date-time
    example: 2025-10-08T18:21:10.157+00:00
