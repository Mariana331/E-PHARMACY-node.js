components:
  schemas:

Customer:
  type: object
  required:
    - _id
    - image
    - name
    - email
    - phone
    - address
    - register_date
  properties:
    _Id:
      type: string
      description: Customer id
      example: 68efd834f1781f960b1e7a6c
    image:
      type: string
      description: Customer image
      example: https://i.imgur.com/hz6bZkb.png
    name:
      type: string
      description: Customer name
      example: Serhii Mykhailenko
    email:
      type: string
      description: Customer email
      example: serhii.mykhailenko@gmail.com
    phone:
      type: string
      description: Customer phone
      example: +380727390123
    address:
      type: string
      description: Customer address
      example: Sviatoshynska, Bldg. 4, Apt. 117
    register_date:
      type: string
      format: date-time
      example: 2025-10-08T18:21:10.157+00:00

      Order:
        type: object
        required:
          - _id
          - photo
          - name
          - address
          - products
          - totalPrice
          - status
          - order_date
        properties:
          _id:
            type: string
            description: Order id
            example: 68efd834f1781f960b1e7a6c
          photo:
            type: string
            description: Order photo
            example: https://i.imgur.com/hz6bZkb.png
          name:
            type: string
            description: Order name
            example: Noah Davis
          address:
            type: string
            description: Order address
            example: Banani-11, Bldg. 91, Apt. 181
          totalPrice:
            type: number
            description: totalPrice
            example: 420.50
          status:
            type: string
            description: Order status
            enum:
              [
                'Delivered',
                'Processing',
                'Completed',
                'Shipped',
                'Cancelled',
                'Confirmed',
              ]
            example: Delivered
          order_date:
            type: string
            format: date-time
            example: 2025-10-08T18:21:10.157+00:00
